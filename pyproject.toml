[project]
name = "pafbench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pysam", "numpy", "numba", "pandas", "pyarrow", "gffutils", "biopython", "dill", "pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pafbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
